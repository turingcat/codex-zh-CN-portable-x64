name: windows-smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node tests with bundled runtime
        shell: powershell
        env:
          CODEX_ZH_CN_TEST_FIXTURE: "1"
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\bootstrap_windows.ps1 -Action test -NoPause
      - name: Windows fixture smoke
        shell: powershell
        env:
          CODEX_ZH_CN_TEST_FIXTURE: "1"
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          .\tests\windows-smoke.ps1
